.custom-pin {

  color: white; /* Kolor symbolu w środku */

  height: 36px;
  box-sizing: border-box; /* Ważne dla obramowania */
}

/* Kolory wypełnienia kółka w zależności od typu */
.pin-rakieta { background-color: #e74c3c; }   /* Czerwony */

.pin-balon { background-color: #3498db; }     /* Niebieski */

  samolot: { icon: 'fa-jet-fighter-up', class: 'pin-samolot' }

// Funkcja tworząca ikony-kółka
function stworzIkone(typ) {
  const dane = typyObiektow[typ] || { icon: 'fa-circle-exclamation', class: 'pin-rakieta' };
  
  // Rozmiar kółka musi się zgadzać ze stylami CSS
  const rozmiar = 36;
  
  return L.divIcon({
    className: '', 
    // Dodajemy strukturę HTML dla kółka
    html: `<div class="custom-pin ${dane.class}"><i class="fa-solid ${dane.icon}"></i></div>`,
    iconSize: [rozmiar, rozmiar],
    // Kotwica ustawiona w środku kółka
    iconAnchor: [rozmiar / 2, rozmiar / 2],
    // Popup ustawiony tuż nad górną krawędzią kółka
    popupAnchor: [0, -rozmiar / 2]
  });
}
